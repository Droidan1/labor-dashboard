# retjg-mcp — read-only MCP server over the reporting API, for Claude's custom
# connector (static key) and, via OAuth sign-in with RETJG HUB, ChatGPT (and
# optionally Claude). Deployed separately from the main worker:
#   npx wrangler deploy -c <repo>/mcp/wrangler.toml
# 🛑 Never a bare `npx wrangler deploy` from the repo root: that is the MAIN worker.
#
# Secrets (never in this file — the repo is public):
#   MCP_KEY            what Claude sends as "Authorization: Bearer <key>"
#   REPORTING_API_KEY  the main worker's MORNING_BRIEFING_KEY, used upstream
#   AGENT_WRITE_KEY    the main worker's AGENT_WRITE_KEY, for update_supply_request only
#                      (without it, every caller is read-only)
# KV OAUTH_KV: the OAuth library's store (grants, hashed tokens, encrypted props).
# Without the binding the worker behaves exactly as phase 1 (static key only).
name = "retjg-mcp"
main = "worker.mjs"
compatibility_date = "2026-09-01"
# The OAuth library fetches ChatGPT's and Claude's client metadata documents only
# when fetch() is restricted to the public internet (SSRF protection).
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false

routes = [{ pattern = "mcp.retjghub.com", custom_domain = true }]

# The RETJG HUB user Claude's static key (MCP_KEY) acts for when it writes: Brian.
# The main worker re-checks on every write that this is an active superuser.
# OAuth callers never write (their consent screen says read-only).
[vars]
MCP_KEY_USER = "usr_superuser_001"

# The main worker, called directly rather than over the public hostname.
[[services]]
binding = "API"
service = "clover-sales-api"

# The OAuth library's store: grants, hashed tokens and codes, encrypted props.
# Created 2026-10-14 with `npx wrangler kv namespace create OAUTH_KV` (an id, not a secret).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "64b2734b617847809df251afeaace2bd"
