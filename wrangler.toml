name = "clover-sales-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cron triggers:
#   - "55 3 * * *"  — 11:55 PM ET (03:55 UTC) daily end-of-day snapshot rollup
#   - "* * * * *"   — every minute: sale scheduler (activate pending, revert expired)
#   - "0 12 * * *"  — 8 AM ET daily summary email (12:00 UTC = EDT; runs after the
#                     7 AM auction feeder so the email includes auction. In EST this
#                     is 7 AM ET — bump to "0 13 * * *" when DST ends in November.)
#   - "0 * * * *"   — top of every hour: interval sales summary push notifications
#   - "0 11 * * 1"  — 7 AM ET Sunday weekly digest (11:00 UTC = EDT). NOTE: Cloudflare
#                     cron day-of-week is 1-7 where 1=Sunday, 7=Saturday (NOT POSIX
#                     0=Sun). "0" is rejected as invalid. Must match the handler's
#                     exact string "0 11 * * 1".
#
# NOTE: bin-photo auto-drafting is deliberately NOT a cron. It hangs off the
# photo-upload request itself (ensureAutoDraftForPhotos), so a draft appears as
# soon as a manager submits rather than at a fixed hour — and it needs no
# day-of-week arithmetic, no DST handling, and no Flow Calendar coverage.
[triggers]
crons = ["55 3 * * *", "* * * * *", "0 12 * * *", "0 11 * * 1", "0 * * * *", "30 10 * * *"]

[vars]
# 🔑 API TOKENS AND SNAPSHOT_SECRET ARE SECRETS, NOT vars.
# This file is tracked in a PUBLIC repo. Anything written here as a [vars] entry
# is world-readable at raw.githubusercontent.com. The Clover API tokens and
# SNAPSHOT_SECRET lived here in plaintext from 2026-04-08 to 2026-08-03; they are
# now Worker secrets and MUST NOT be added back.
#   bash scripts/migrate-secrets.sh      # one-time move of existing values
#   npx wrangler secret put BL1_API_TOKEN [--env staging]   # to rotate one
# Merchant IDs stay here on purpose: they are account identifiers, not
# credentials (they appear in Clover URLs and on receipts), and keeping them
# visible documents which store maps to which account.
BL1_MERCHANT_ID = "T3M0E73JKKF11"
BL2_MERCHANT_ID = "57QXWH2573AX1"
BL4_MERCHANT_ID = "PVBSM4E6G94V1"
BL8_MERCHANT_ID = "57KWEPWZ4BHT1"
BL12_MERCHANT_ID = "1AEWTY5Q9A3G1"
BL14_MERCHANT_ID = "1RBVSDGEQYA21"
# BL16 (Indy East) reuses the former Wyoming (BL12) Clover account — the register
# was relocated when Wyoming closed and Indy opened. Keep in sync with BL12.
BL16_MERCHANT_ID = "1AEWTY5Q9A3G1"
VAPID_SUBJECT = "mailto:noreply@retjghub.com"

# KV namespace for storing daily sales snapshots
# Create with: npx wrangler kv:namespace create SALES_SNAPSHOTS
# Then replace the id below with the generated namespace ID
[[kv_namespaces]]
binding = "SALES_SNAPSHOTS"
id = "8f6062a726fd4fd2afcffc0512790884"

# D1 database for structured historical sales data
# Create with: npx wrangler d1 create labor-dashboard-db
# Then replace the database_id below with the generated ID
# Apply schema: npx wrangler d1 execute labor-dashboard-db --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "labor-dashboard-db"
database_id = "3fa911d7-31d6-438c-985f-7ac08c407d2d"

# R2 bucket for marketing media (manager photo submissions, generated assets).
# Create with: npx wrangler r2 bucket create bl-marketing-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bl-marketing-media"

# ── Staging environment ───────────────────────────────────────────────
# Deploy:  npx wrangler deploy --env staging
# Isolated D1 + KV; NO crons (avoids double notifications / snapshot writes).
# Secrets are per-env — set them once:
#   npx wrangler secret put VAPID_PUBLIC_KEY  --env staging
#   npx wrangler secret put VAPID_PRIVATE_KEY --env staging
# Named environments do NOT inherit top-level [vars], so they are repeated here.
[env.staging]
name = "clover-sales-api-staging"

# Staging runs ONLY the Meta marketing refresh cron — NOT the snapshot /
# notification jobs (those would double-fire against prod data). Named envs
# otherwise inherit the top-level [triggers], so this list is explicit.
[env.staging.triggers]
# Meta refresh + the every-minute tick (sale scheduler is prod-gated to skip on
# staging, so only the scheduled bin-post publisher actually runs here).
crons = ["30 10 * * *", "* * * * *"]

[env.staging.vars]
# Secrets are per-environment — staging needs its own `--env staging` copies.
BL1_MERCHANT_ID = "T3M0E73JKKF11"
BL2_MERCHANT_ID = "57QXWH2573AX1"
BL4_MERCHANT_ID = "PVBSM4E6G94V1"
BL8_MERCHANT_ID = "57KWEPWZ4BHT1"
BL12_MERCHANT_ID = "1AEWTY5Q9A3G1"
BL14_MERCHANT_ID = "1RBVSDGEQYA21"
# BL16 (Indy East) reuses the former Wyoming (BL12) Clover account — the register
# was relocated when Wyoming closed and Indy opened. Keep in sync with BL12.
BL16_MERCHANT_ID = "1AEWTY5Q9A3G1"
VAPID_SUBJECT = "mailto:noreply@retjghub.com"
# Env-aware hosts (worker.js falls back to prod literals when unset).
APP_ORIGIN = "https://staging.retjghub.com"
API_ORIGIN = "https://api-staging.retjghub.com"
# OPENAI_BASE unset = call api.openai.com directly (the worker retries across
# Cloudflare's egress-IP pool to dodge OpenAI's edge rate-limit / err 1015).
# To route via AI Gateway instead, set it to the gateway .../openai URL.

[[env.staging.kv_namespaces]]
binding = "SALES_SNAPSHOTS"
id = "f90d56417cf448aa979ad83988daa8b1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "labor-dashboard-db-staging"
database_id = "b40982c2-4009-4842-bc17-fa0977468b07"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "bl-marketing-media-staging"
