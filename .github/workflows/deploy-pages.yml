name: Deploy production to GitHub Pages

# Production (www.retjghub.com) is GitHub Pages. Instead of serving the raw
# committed files (which let tailwind.css go stale → unstyled site), this
# builds the frontend with scripts/build.sh and publishes the built dist/.
# The CSS is regenerated on every deploy, so it can never drift again.
#
# Staging is unaffected — it stays on its own Cloudflare Pages project.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, GitHub's own Pages starter shape. 🛑 2026-11-24: four deploys in a row (#410,
# #411) failed with deploy-pages "Found 0 artifact(s)" a second after the upload succeeded
# in the SAME job, while the run's artifact list showed it (1.3 MB). Response: the v5 majors
# (the v3/v4 pins were Node 20 builds the runner force-ran on Node 24), and the deploy in a
# second job, so the upload is finalised before anything looks it up.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build frontend (regenerates tailwind.css)
        run: bash scripts/build.sh
        env:
          # Force the production API base (build.sh only rewrites to staging
          # when this is set to something other than "main").
          CF_PAGES_BRANCH: main

      # v4+ leaves dotfiles out of the artifact; dist/ has none (build.sh is an allowlist).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
